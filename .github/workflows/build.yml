name: Go Build Test

on:
  schedule:
    - cron: "25 */2 * * *"
  push:
    branches:    
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Time
      run: |
        echo "$(date '+%Y-%m-%d %H:%M:%S %Z')"
    
    - name: Setup
      uses: AnimMouse/setup-cloudflared@v2

    - name: Config Origin
      uses: AnimMouse/setup-cloudflared/tunnel@v2
      with:
        cloudflare_tunnel_credential: ${{ secrets.CF_CR }}
        cloudflare_tunnel_configuration: ${{ secrets.CF_CG }}
        cloudflare_tunnel_id: ${{ secrets.CF_ID }}
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.17.0'

    - name: Go Tidy
      run: |
        go mod tidy && go mod download

    - name: Run Build
      run: |
        go run -tags "with_wireguard with_gvisor" ./cmd/sing-box run -c ./test/config/sample.json

    - name: Clean
      if: always()
      uses: AnimMouse/setup-cloudflared/shutdown@v2
      
